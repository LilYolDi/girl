
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#160d22">
  <title>Королевский гардероб</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="crown">♛</div>
    <div>
      <h1>Королевский гардероб</h1>
      <p>Создай свой идеальный образ</p>
    </div>
  </header>

  <main>
    <section class="stage">
      <img id="girl" src="girl.jpg" alt="Девушка на королевском троне">
      <div class="look-label" id="lookLabel">Образ № 1</div>
      <button id="poseBtn">♡ Поза</button>
      <button id="animationBtn">▶ Анимация</button>
    </section>

    <section class="wardrobe">
      <h2>Гардероб</h2>

      <nav class="categories">
        <button data-category="tights">Колготки</button>
        <button data-category="socks">Носки</button>
        <button data-category="stockings">Чулки</button>
        <button data-category="tops">Верх</button>
        <button data-category="skirts">Юбки</button>
        <button data-category="shoes">Обувь</button>
      </nav>

      <h3 id="categoryTitle">Колготки</h3>
      <div id="items" class="items"></div>

      <div class="actions">
        <button id="randomBtn">✦ Случайный образ</button>
        <button id="saveBtn">♛ Сохранить образ</button>
      </div>
      <p id="status">Выбери категорию одежды</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
